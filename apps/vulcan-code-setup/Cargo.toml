[package]
name = "vulcan-code-setup"
description = "Setup program that installs, updates, modifies and removes a per-user Vulcan Code from the signed release objects."
# The setup program is released apart from the product (`release-setup.yml`) and keeps its own
# version here; only a change to the setup program itself raises it.
# 安装器独立于产品发布（`release-setup.yml`），其版本只在此处定义；只有安装器本身变化时才递增。
version = "0.2.13"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Only the Windows registry, message and shortcut calls in `src/windows.rs` may use unsafe code.
# 只有 `src/windows.rs` 中的 Windows 注册表、消息与快捷方式调用可以使用 unsafe 代码。
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vulcan-code-setup"
path = "src/main.rs"

# The setup program is linked statically on Linux and downloaded before anything else, so it keeps a
# deliberately small dependency list and stays outside workspace-hack (see `.config/hakari.toml`).
# 安装器在 Linux 上静态链接，且先于其他内容下载，因此刻意保持很少的依赖，并且不使用 workspace-hack
# （见 `.config/hakari.toml`）。
[dependencies]
dirs.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
vulcan-i18n.workspace = true
vulcan-install-core = { workspace = true, features = ["http"] }

[target.'cfg(unix)'.dependencies]
# Under `curl | sh` install.sh hands the setup program `/dev/tty` as its input. crossterm's default
# kqueue input source cannot watch `/dev/tty` on macOS ("Failed to initialize input reader"), so the
# setup program uses its select/poll-based `/dev/tty` source instead.
# 在 `curl | sh` 下 install.sh 把 `/dev/tty` 作为安装器的输入。crossterm 默认的 kqueue 输入源在 macOS
# 上无法监听 `/dev/tty`（"Failed to initialize input reader"），因此安装器改用其基于 select/poll 的
# `/dev/tty` 输入源。
crossterm = { workspace = true, features = ["use-dev-tty"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# COM interfaces for the shortcuts, which `windows-sys` does not wrap.
# 快捷方式所需的 COM 接口，`windows-sys` 不提供其封装。
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
